name: Basic checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    name: Syntax and DEMO
    runs-on: windows-latest
    timeout-minutes: 5
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check syntax and run DEMO without external services
        run: .\tests\Run-SmokeTests.ps1
